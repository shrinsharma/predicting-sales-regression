<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store Sales Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="card shadow">
        <h2 class="text-center mb-4">
            🛒 Store Sales Prediction
        </h2>
        <p class="text-center text-muted">Project 3 - Regression - Best Model: GradientBoosting R2 0.6601</p>

        <form action="/predict" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Store (1-1115)</label>
                    <input class="form-control" type="number" name="Store" min="1" max="1115" value="{{ Store if Store else '1' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">DayOfWeek (1=Mon ... 7=Sun)</label>
                    <select class="form-control" name="DayOfWeek" required>
                        <option value="1" {% if DayOfWeek==1 %}selected{% endif %}>1 - Monday</option>
                        <option value="2" {% if DayOfWeek==2 %}selected{% endif %}>2 - Tuesday</option>
                        <option value="3" {% if DayOfWeek==3 %}selected{% endif %}>3 - Wednesday</option>
                        <option value="4" {% if DayOfWeek==4 %}selected{% endif %}>4 - Thursday</option>
                        <option value="5" {% if DayOfWeek==5 %}selected{% endif %}>5 - Friday</option>
                        <option value="6" {% if DayOfWeek==6 %}selected{% endif %}>6 - Saturday</option>
                        <option value="7" {% if DayOfWeek==7 %}selected{% endif %}>7 - Sunday</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Date</label>
                <input class="form-control" type="date" name="Date" value="{{ Date if Date else '' }}" required>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Open (0=Closed, 1=Open)</label>
                    <select class="form-control" name="Open" required>
                        <option value="1" {% if Open==1 %}selected{% endif %}>1 - Open</option>
                        <option value="0" {% if Open==0 %}selected{% endif %}>0 - Closed</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Promo (0=No, 1=Yes)</label>
                    <select class="form-control" name="Promo" required>
                        <option value="1" {% if Promo==1 %}selected{% endif %}>1 - Promo Yes</option>
                        <option value="0" {% if Promo==0 %}selected{% endif %}>0 - No Promo</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">SchoolHoliday</label>
                    <select class="form-control" name="SchoolHoliday" required>
                        <option value="0" {% if SchoolHoliday==0 %}selected{% endif %}>0 - No</option>
                        <option value="1" {% if SchoolHoliday==1 %}selected{% endif %}>1 - Yes</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">StateHoliday (0=None, a=Public, b=Easter, c=Christmas)</label>
                <select class="form-control" name="StateHoliday" required>
                    <option value="0" {% if StateHoliday=='0' %}selected{% endif %}>0 - No Holiday</option>
                    <option value="a" {% if StateHoliday=='a' %}selected{% endif %}>a - Public Holiday</option>
                    <option value="b" {% if StateHoliday=='b' %}selected{% endif %}>b - Easter</option>
                    <option value="c" {% if StateHoliday=='c' %}selected{% endif %}>c - Christmas</option>
                </select>
            </div>

            <button class="btn btn-primary w-100">
                Predict Sales
            </button>
        </form>

        {% if prediction is defined %}
        <hr>
        <h4 class="text-center">Prediction</h4>
        <h2 class="text-center">
            ₹ {{ prediction }}
        </h2>
        <h5 class="text-center">
            Model: GradientBoosting (Best R2 0.6601)
        </h5>
        {% endif %}
    </div>
</div>
</body>
</html>
